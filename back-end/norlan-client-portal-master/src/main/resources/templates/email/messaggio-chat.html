<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px;">
<div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
    <div style="background-color: #1B4B6B; color: #ffffff; padding: 20px; text-align: center;">
        <h2 style="margin: 0; font-size: 20px; text-transform: uppercase; tracking: 1px;">Nuovo Messaggio Chat</h2>
    </div>
    <div style="padding: 30px; color: #333333;">
        <p style="font-size: 14px; color: #666;">Hai ricevuto una nuova comunicazione da:</p>
        <p style="font-weight: bold; color: #1B4B6B; font-size: 16px;" th:text="${mittenteEmail}">mittente@esempio.it</p>

        <div style="margin-top: 25px; padding: 20px; background-color: #F8F9FA; border-left: 4px solid #1B4B6B; border-radius: 4px;">
            <p style="margin: 0; font-style: italic; line-height: 1.6;" th:utext="${contenutoMessaggio}">
                Testo del messaggio...
            </p>
        </div>

        <div style="text-align: center; margin-top: 35px;">
            <a href="http://localhost:5173/login"
               style="background-color: #1B4B6B; color: #ffffff; padding: 12px 25px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 14px; display: inline-block;">
                RISPONDI NEL PORTALE
            </a>
        </div>
    </div>
    <div style="background-color: #f8f9fa; padding: 15px; text-align: center; font-size: 11px; color: #999; border-top: 1px solid #eee;">
        <p>&copy; 2026 NorLan S.p.A. - Sistema di Notifica Automatico</p>
    </div>
</div>
</body>
</html>
