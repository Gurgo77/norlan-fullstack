<!doctype html>
<!--
Template HTML root dell'applicazione SvelteKit.
Definisce la struttura base del documento, i meta-tag di configurazione (viewport, charset),
l'icona del sito e i segnaposti (%sveltekit.head% e %sveltekit.body%) dove
il framework inietterà dinamicamente il markup generato lato server o client.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/NorlanLogo.jpg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
